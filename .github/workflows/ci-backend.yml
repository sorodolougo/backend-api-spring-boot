# ====================================================================================
# ROLE : PIPELINE D'INTÉGRATION CONTINUE (CI/CD - GITHUB ACTIONS)
// RESPONSIBILITY : Automatise la construction, la compilation et l'exécution de la
  // suite de tests unitaires (JUnit 5 / Mockito) à chaque Push ou Pull Request sur GitHub.
# ARCHITECTURE : Utilise des conteneurs isolés sous Ubuntu avec mise en cache Maven
# pour optimiser la vitesse d'assemblage et garantir la stabilité de l'ERP.
# ====================================================================================

name: GesCom ERP - Backend CI Pipeline

# 1. DÉCLENCHEURS : Le robot s'active à chaque push ou pull request sur la branche principale
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    # Utilise la dernière version stable d'Ubuntu fournie par GitHub
    runs-on: ubuntu-latest

    steps:
      # Étape A : Téléchargement du code source depuis le dépôt GitHub
      - name: Checkout du code source
        uses: actions/checkout@v4

      # Étape B : Installation et configuration de l'environnement Java 21
      - name: Configuration du JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # Distribution recommandée pour la production (Eclipse Temurin)
          cache: 'maven'          # Met en cache les fichiers .jar pour accélérer les futurs builds

      # Étape C : Compilation du projet et exécution automatisée de la suite de tests
      # C'est l'équivalent exact de ton double-clic sur Maven Lifecycle 'test' !
      - name: Compilation et Exécution des Tests avec Maven
        run: mvn -B clean test
